services:
  - type: web
    name: campus2career-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --prefer-offline --no-audit --progress=false || (npm cache clean --force && npm install)
    startCommand: npm start
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: npm_config_fetch_retries
        value: "5"
      - key: npm_config_fetch_retry_factor
        value: "2"
      - key: npm_config_fetch_retry_maxtimeout
        value: "60000"
      - key: npm_config_fetch_retry_mintimeout
        value: "10000"
  - type: web
    name: campus2career-recommendations
    runtime: python
    rootDir: recommendation_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
