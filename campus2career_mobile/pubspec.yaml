name: campus2career_mobile
description: "Campus2Career native Android client — Academia • Industry • Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0-272.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Token storage (using shared_preferences for max device compatibility;
  # flutter_secure_storage/Tink can crash on some Android devices at app start)
  shared_preferences: ^2.3.3

  # Routing
  go_router: ^14.6.2

  # External browser (for learning providers)
  url_launcher: ^6.3.1

  # Images
  cached_network_image: ^3.4.1

  # Misc utilities
  intl: ^0.20.1
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
